{% extends 'base.html' %}
{% block title %}Google orqali kirish - Taklifnoma.uz{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 text-center">
                <div class="mb-4">
                    <div class="display-5 text-warning mb-2">
                        <i class="fa-solid fa-envelope-open-text"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Taklifnoma.uz</h2>
                    <p class="text-muted">Saytdan foydalanish uchun iltimos Google hisobingiz orqali kiring.</p>
                </div>

                <!-- Google OAuth Redirect Button -->
                <a href="{% url 'google_redirect' %}" class="btn btn-danger w-100 py-3 rounded-pill fw-bold text-white shadow-sm mb-3" style="background: #db4437; border: none;">
                    <i class="fa-brands fa-google me-2"></i> Google orqali kirish
                </a>

                <hr class="my-4 text-muted">

                <!-- Demo Login Button for instant access / testing -->
                <button type="button" class="btn btn-outline-warning w-100 py-2 rounded-pill fw-semibold" onclick="demoGoogleLogin()">
                    <i class="fa-solid fa-google me-2 text-danger"></i> Sinov tariqasida kirish
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function demoGoogleLogin() {
        const email = prompt("Google email manzilingizni kiriting:", "user@gmail.com");
        if (email) {
            const name = prompt("Ismingizni kiriting:", "Hurmatli Mehmon");
            fetch("{% url 'google_callback' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ email: email, name: name || 'Google User' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = "{% url 'home' %}";
                } else {
                    alert('Xatolik yuz berdi.');
                }
            });
        }
    }
</script>
{% endblock %}
